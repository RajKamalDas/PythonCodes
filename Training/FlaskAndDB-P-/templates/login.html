{% extends "base.html" %}
{% block content %}
<h2>Admin Login</h2>

<form method="POST">
    <input type="text" name="username" placeholder="Admin283" required>
    <input type="password" name="password" placeholder="********" required>
    <button>Login</button>
</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% endblock %}
