<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    
</head>
<body>
<header class="site-header">
    <nav class="navbar">
        <img src="{{url_for('static', filename='image.png')}}" alt="E-Library Logo" class="brand" width="100">

        <ul id="primary-menu">
            <li class="has-dropdown">
                <button class="dropdown-trigger">&#9776;</button>
                <ul class="submenu">
                    <li><a href="/">Home</a></li>
                    <li><a href="/signup">Signup</a></li>
                    <li><a href="/login">Login</a></li>
                    <li><a href="/logout">Logout</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

{% block content %}{% endblock %}

<footer class="site-footer">
    <div class="footer-contact">
        <p>Email: support@elibrary.com</p>
    </div>
    <hr>
    <p class="footer-copy">&copy; 2026 E-Library. All rights reserved.</p>
</footer>

<script src="/static/script.js"></script>
</body>
</html>
