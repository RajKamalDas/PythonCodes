{% extends "base.html" %}

{% block content %}
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
    }

    .container {
        min-height: 87.9vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #1cc88a);
    }

    .signup-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 40px;
        border-radius: 24px;
        width: 420px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .signup-card h2 {
        text-align: center;
        color: #ffffff;
        font-size: 32px;
        margin-bottom: 15px;
        width: 100%;
    }

    .form-group {
        width: 100%;
        margin-bottom: 10px;
    }

    .form-group label {
        display: block;
        color: #ffffff;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .form-group input {
        width: 100%;
        box-sizing: border-box;
        padding: 15px 18px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.20);
        color: #ffffff;
        outline: none;
        font-size: 14px;
        transition: 0.3s ease;
    }

    .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.8);
    }

    .form-group input:focus {
        border: 1px solid #1cc88a;
        box-shadow: 0 0 12px rgba(28, 200, 138, 0.7);
    }

    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 45px;
    }

    .toggle-btn {
        position: absolute;
        right: 18px;
        top: 62%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 15px;
        color: #ffffff;
    }

    .submit-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(45deg, #667eea, #1cc88a);
        border: none;
        border-radius: 18px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        font-size: 15px;
        transition: 0.3s ease;
    }

    .submit-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .login-option {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #ffffff;
    }

    .login-option a {
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
        margin-left: 5px;
        transition: 0.3s ease;
    }

    .login-option a:hover {
        text-decoration: underline;
        color: #c5e4d9;
    }
</style>
<div class="container">
    <form method="POST" onsubmit="return checkPassword()" class="signup-card">

        <h2>Sign Up</h2>
        {% if error %}
        {% if "Username" in error or "Something" in error %}
        <p style="color: red; background-color: #ffffff43;">{{ error }}</p>
        {% endif %}
        {% endif %}
        <div class="form-group">
            <label>Username</label>
            <input name="username" type="text" placeholder="Enter Username" required>
        </div>
        
        {% if error %}
        {% if "Email" in error %}
        <p style="color: red; background-color: #ffffff43;">{{ error }}</p>
        {% endif %}
        {% endif %}
        <div class="form-group">
            <label>Email</label>
            <input name="email" type="email" placeholder="Enter Email" required>
        </div>

        <div class="form-group password-box">
            <label>Password</label>
            <input name="password" type="password" id="pass1" placeholder="Enter Password" required>
            <span class="toggle-btn" onclick="togglePassword('pass1')">👁</span>
        </div>

        <div class="form-group password-box">
            <label>Re-enter Password</label>
            <input type="password" id="pass2" placeholder="Re-enter Password" required>
            <span class="toggle-btn" onclick="togglePassword('pass2')">👁</span>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
        <div class="login-option">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </form>
</div>
<script>
    function togglePassword(id) {
        var input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
    }

    function checkPassword() {
        var pass1 = document.getElementById("pass1");
        var pass2 = document.getElementById("pass2");

        if (pass1.value !== pass2.value) {
            alert("Passwords are not same");
            pass2.classList.add("not-match");
            pass2.classList.remove("match");
            return false;
        }

        pass2.classList.remove("not-match");
        pass2.classList.add("match");
        return true;
    }
    document.getElementById("pass2").addEventListener("input", function () {
        var pass1 = document.getElementById("pass1").value;

        if (this.value === pass1 && this.value !== "") {
            this.classList.add("match");
            this.classList.remove("not-match");
        } else {
            this.classList.add("not-match");
            this.classList.remove("match");
        }
    });
</script>
{% endblock %}
