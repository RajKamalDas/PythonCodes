{% extends "base.html" %}

{% block content %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 140px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 0;
    }

    .login-card {
        width: 400px;
        padding: 45px 40px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        text-align: center;
        color: #fff;
        transition: 0.4s ease;
    }

    .login-card:hover {
        transform: translateY(-5px);
    }


    .login-card h2 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 35px;
        letter-spacing: 1px;
    }


    .form-group {
        text-align: left;
        margin-bottom: 25px;
        position: relative;
    }


    .form-group label {
        font-size: 14px;
        font-weight: 500;
    }


    .form-group input {
        width: 120%;
        padding: 12px;
        margin-top: 8px;
        border-radius: 10px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
        font-size: 14px;
        transition: 0.3s;
    }

    .form-group input::placeholder {
        color: #eee;
    }

    .form-group input:focus {
        background: rgba(255, 255, 255, 0.4);
    }


    .password-field span {
        translate: 35px -7px;
        position: absolute;
        right: 0px;
        top: 42px;
        cursor: pointer;
        font-size: 18px;
    }


    .login-btn {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #ffffff;
        color: #4e73df;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .login-btn:hover {
        background: #f1f1f1;
        transform: scale(1.03);
    }


    .login-links {
        margin-top: 25px;
        text-align: center;
        font-size: 14px;
        color: #ffffff;
    }


    .login-links a:first-child {
        display: inline-block;
        padding: 8px 18px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.25);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 12px;
        transition: 0.3s ease;
    }

    .login-links a:first-child:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: scale(1.05);
    }


    .login-links a:not(:first-child) {
        color: #ffffff;
        font-weight: 500;
        text-decoration: none;
        padding: 5px 10px;
        border-radius: 15px;
        transition: 0.3s ease;
    }

    .login-links a:not(:first-child):hover {
        background: rgba(255, 255, 255, 0.25);
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Login</h2>

        <center>
            <form method="POST">
                {% if error %}
                {% if not "Password" in error %}
                <p style="color: red; background-color: #ffffff43;">{{ error }}</p>
                {% endif %}
                {% endif %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter Username" name="username" required>
                </div>
                {% if error %}
                {% if "Password" in error %}
                <p style="color: red; background-color: #ffffff43;">{{ error }}</p>
                {% endif %}
                {% endif %}
                <div class="form-group password-field">
                    <label>Password</label>
                    <input type="password" placeholder="Enter Password" id="password" name="password" required>
                    <span onclick="togglePassword()">👁</span>
                </div>
        </center>

        <button type="submit" class="login-btn">Login</button>

        </form>
    </div>
</div>

<script>
    function togglePassword() {
        var pass = document.getElementById("password");
        pass.type = pass.type === "password" ? "text" : "password";
    }
</script>


{% endblock %}
